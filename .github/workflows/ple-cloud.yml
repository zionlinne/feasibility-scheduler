name: PLE single task on cloud FBS API
on:
  push:
    branches: ['experiment/ple-local-adapter-20261117']
    paths: ['cloud/ple-start.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ple-cloud-single-task
  cancel-in-progress: false
jobs:
  engineering:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require configured API key
        env:
          MODEL_API_KEY: ${{ secrets.FBS_MODEL_API_KEY }}
        run: |
          if [ -z "$MODEL_API_KEY" ]; then
            echo 'Add repository Actions secret FBS_MODEL_API_KEY before starting the API run.'
            exit 1
          fi
      - name: Set private runtime paths
        shell: bash
        run: |
          echo "HF_HOME=$RUNNER_TEMP/ple-auth/huggingface" >> "$GITHUB_ENV"
          echo "PLE_OPERATOR=$RUNNER_TEMP/ple-operator" >> "$GITHUB_ENV"
          echo "PLE_KIT=$RUNNER_TEMP/ple-kit" >> "$GITHUB_ENV"
          echo "PLE_RUN=$RUNNER_TEMP/ple-run" >> "$GITHUB_ENV"
      - name: Install pinned operator tools and official kit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PLE_OPERATOR" "$HF_HOME"
          chmod 700 "$PLE_OPERATOR" "$HF_HOME"
          python -m pip install uv==0.13.8 huggingface-hub==1.33.0
          uv tool install harbor==0.20.0 --with websockets==15.0.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          git clone https://github.com/google-research/ple.git "$PLE_KIT"
          git -C "$PLE_KIT" checkout 8320f0402fdca9f42476607f72bcfd5271cd50c9
          docker info --format '{{.ServerVersion}}'
      - name: Verify API JSON and tool calls, then write private credentials
        env:
          MODEL_API_KEY: ${{ secrets.FBS_MODEL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PLE_KIT"
          PYTHONPATH="$PLE_KIT" uv run --with pyyaml python "$GITHUB_WORKSPACE/cloud/check_api.py" "$GITHUB_WORKSPACE" \
            2>&1 | tee "$PLE_OPERATOR/api-check.log"
          python - <<'PY'
          import os, pathlib
          root=pathlib.Path(os.environ['PLE_OPERATOR'])
          token=os.environ['MODEL_API_KEY']
          if any(c in token for c in '\r\n\x00'): raise ValueError('Invalid API key')
          (root/'model.env').write_text('MODEL_API_KEY='+token+'\n',encoding='utf-8')
          (root/'model.env').chmod(0o600)
          PY
      - name: Authorize approved Hugging Face account
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$HF_TOKEN" ]; then
            unset HF_TOKEN
            echo 'Use the Hugging Face account approved for google/physical-engineerings-last-exam.'
            hf auth login --format agent
          fi
          hf auth whoami
      - name: Run representative task with the actual PR5 FBS runner
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$HF_TOKEN" ]; then unset HF_TOKEN; fi
          cd "$PLE_KIT"
          uv run python eval/run.py "$GITHUB_WORKSPACE" \
            --env-file "$PLE_OPERATOR/model.env" \
            --tasks frame-extension-method --trials 1 --attempts 1 --out "$PLE_RUN" \
            2>&1 | tee "$PLE_OPERATOR/evaluation.log"
      - name: Collect serve metadata logs
        if: ${{ always() && env.PLE_RUN != '' }}
        shell: bash
        run: |
          python - <<'PY'
          import os,pathlib,shutil
          run=pathlib.Path(os.environ['PLE_RUN'])
          target=pathlib.Path(os.environ['PLE_OPERATOR'])/'serve-logs'
          target.mkdir(parents=True,exist_ok=True)
          for i,p in enumerate(run.glob('attempt*/jobs/dev/*/agent/serve.log')):
              shutil.copyfile(p,target/(str(i)+'-serve.log'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ple-fbs-cloud-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/ple-run/results.json
            ${{ runner.temp }}/ple-run/export.json
            ${{ runner.temp }}/ple-run/artifacts/
            ${{ runner.temp }}/ple-operator/evaluation.log
            ${{ runner.temp }}/ple-operator/api-check.log
            ${{ runner.temp }}/ple-operator/serve-logs/
      - name: Remove private credentials
        if: always()
        shell: bash
        run: |
          if [ -n "${PLE_OPERATOR:-}" ]; then rm -f -- "$PLE_OPERATOR/model.env"; fi
