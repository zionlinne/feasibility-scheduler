name: FBS Gaokao 2026 Lean experiment

on:
  push:
    branches:
      - experiment/lean-acceptance-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Lean with Mathlib
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: experiments/gaokao_2026
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Install FBS package and Python tests
        run: python -m pip install -e . pytest
      - name: Run actual Lean 4 acceptance tests
        working-directory: experiments/gaokao_2026
        run: PYTHONPATH="$GITHUB_WORKSPACE/src" lake env python -m pytest -v "$GITHUB_WORKSPACE/tests/test_lean_acceptance.py"
      - name: Run 2026 National I geometry P15 reduced-goal experiment
        working-directory: experiments/gaokao_2026
        run: PYTHONPATH="$GITHUB_WORKSPACE/src" lake env python "$GITHUB_WORKSPACE/scripts/run_gaokao_2026_lean.py"
      - name: Upload FBS trace/result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fbs-gaokao-2026-result
          path: experiments/gaokao_2026/fbs_gaokao_2026_result.json
          if-no-files-found: warn
